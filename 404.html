<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seite nicht gefunden — Birgit Wurmlinger</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="stylesheet" href="/fonts/fonts.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Raleway', sans-serif;
      font-weight: 300;
      background: #F7F4F0;
      color: #1A1626;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .inner { max-width: 30rem; }
    .mark { font-family: 'Great Vibes', cursive; font-size: 2.6rem; color: #6A886C; margin-bottom: 1.6rem; }
    h1 { font-family: 'Lora', serif; font-size: 1.9rem; font-weight: 400; margin-bottom: 1rem; }
    p { font-size: 0.98rem; line-height: 1.8; color: #46405E; margin-bottom: 2.4rem; }
    a {
      display: inline-block;
      font-size: 0.72rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #A08C6A;
      text-decoration: none;
      border-bottom: 1px solid rgba(160,140,106,0.4);
      padding-bottom: 0.4rem;
      transition: color 0.3s, border-color 0.3s;
    }
    a:hover { color: #6A886C; border-color: #6A886C; }
  </style>
</head>
<body>
  <div class="inner">
    <div class="mark">Birgit Wurmlinger</div>
    <h1>Diese Seite gibt es nicht</h1>
    <p>Vielleicht hat sich ein Tippfehler eingeschlichen, oder die Seite ist umgezogen.
    Auf der Startseite finden Sie alles Weitere.</p>
    <a href="/">Zur Startseite</a>
  </div>
</body>
</html>
